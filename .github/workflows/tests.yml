name: Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic:
    if: github.ref == 'refs/heads/main'
    name: Synthetic regressions (${{ matrix.os }}, PHP 8.3)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up PHP
        uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: '8.3'
          extensions: gd
          coverage: none
          tools: none
      - name: Check syntax and run synthetic regressions
        shell: pwsh
        run: ./scripts/test.ps1 -PhpPath php
